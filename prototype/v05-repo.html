<title>abishek repo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* v0.5 · "the portfolio is a repository" · Threshold dark (single deliberate look) */
:root{
  --bg:#10130F; --bg2:#0C0F0B; --panel:#171B16; --raised:#1F241E; --line:#2C332B; --line2:#232922;
  --ink:#ECE9DF; --muted:#A4A697; --faint:#72766B;
  --accent:#F2A93B; --teal:#4CC3AE; --red:#EC6A52; --violet:#B39DFF; --blue:#7FB8FF; --on-accent:#10130F;
  --display:'Anek Latin','Arial Narrow',Impact,sans-serif; --body:'Geist',ui-sans-serif,system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --title:44px; --tabs:38px; --side:0px; --term:64px; --status:26px;
  --gut:clamp(16px,3.4vw,44px);
  --chrome-top:calc(env(safe-area-inset-top,0px) + var(--title) + var(--tabs));
  --chrome-bot:calc(var(--term) + var(--status) + env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
@media (min-width:1024px){ :root{ --side:252px; --term:96px; } }
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(1rem,.98rem + .09vw,1.0625rem);line-height:1.6;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}

/* ---------- window chrome ---------- */
.titlebar{position:fixed;left:0;right:0;top:0;z-index:60;height:calc(var(--title) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;gap:14px;background:var(--bg2);border-bottom:1px solid var(--line2)}
.lights{display:flex;gap:7px}
.lights i{width:11px;height:11px;border-radius:50%;background:#EC6A52}
.lights i:nth-child(2){background:#F2A93B}.lights i:nth-child(3){background:#4CC3AE}
.crumb{flex:1;min-width:0;font:500 .78rem var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.crumb b{color:var(--ink);font-weight:500}
.goto{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:500 .75rem var(--mono);cursor:pointer}
.goto kbd{font:inherit;color:var(--ink)}
@media (max-width:600px){ .lights{display:none} .crumb{text-align:left} }

.explorer{position:fixed;left:0;top:calc(var(--title) + env(safe-area-inset-top,0px));bottom:calc(var(--status) + env(safe-area-inset-bottom,0px));width:var(--side);z-index:50;background:var(--bg2);border-right:1px solid var(--line2);padding:12px 8px;overflow:auto;display:none}
@media (min-width:1024px){ .explorer{display:block} }
.explorer .hd{font:600 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:6px 10px 10px}
.tree{list-style:none;margin:0;padding:0}
.tree li{margin:0}
.tree .dir{font:500 .8rem var(--mono);color:var(--muted);padding:5px 10px;display:flex;gap:6px}
.tree a{display:flex;align-items:center;gap:8px;font:500 .8rem var(--mono);color:var(--muted);padding:6px 10px;border-radius:7px;position:relative}
.tree a.in{padding-left:28px}
.tree a:hover{background:var(--panel);color:var(--ink)}
.tree a.on{background:var(--raised);color:var(--ink)}
.tree a.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--accent);border-radius:2px}
.tree a .star{margin-left:auto;color:var(--accent);font-size:.7rem}
.tree a.done .st{color:var(--teal)}
.ic{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;font:700 8.5px/1 var(--mono);color:#0C0F0B;flex:none}
.ic.md{background:#7FB8FF}.ic.dart{background:#54C5F8}.ic.js{background:#F2D14B}.ic.sh{background:#8CC84B}.ic.jsx{background:#61DAFB}.ic.log{background:#A4A697}.ic.json{background:#F2A93B}.ic.yml{background:#EC6A52}
.explorer .foot{margin-top:18px;padding:12px 10px;border-top:1px solid var(--line2);font:500 .72rem/1.6 var(--mono);color:var(--faint)}
.explorer .foot b{color:var(--teal);font-weight:500}

.tabs{position:fixed;left:var(--side);right:0;top:calc(var(--title) + env(safe-area-inset-top,0px));z-index:55;height:var(--tabs);display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;background:var(--bg2);border-bottom:1px solid var(--line2)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid var(--line2);font:500 .78rem var(--mono);color:var(--muted);background:transparent;border-top:0;border-bottom:0;border-left:0;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--bg);color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
.tab.new{animation:tabIn .35s cubic-bezier(.16,1,.3,1)}
@keyframes tabIn{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}

.term{position:fixed;left:var(--side);right:0;bottom:calc(var(--status) + env(safe-area-inset-bottom,0px));z-index:55;height:var(--term);background:var(--bg2);border-top:1px solid var(--line2);padding:8px 16px;font:500 .78rem/1.55 var(--mono);color:var(--muted);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.term .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .p{color:var(--accent)} .term .ok{color:var(--teal)} .term .c{color:var(--ink)}
.status{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--status) + env(safe-area-inset-bottom,0px));padding:0 12px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:16px;background:#0A0C09;border-top:1px solid var(--line2);font:500 .72rem/1 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}
.status .br{color:var(--ink)} .status .ok{color:var(--teal)} .status .sp{flex:1}
@media (max-width:640px){ .status .hide-s{display:none} }

/* ---------- main editor ---------- */
main{margin-left:var(--side);padding-top:var(--chrome-top);padding-bottom:var(--chrome-bot)}
.file{position:relative;min-height:calc(100vh - var(--title) - var(--tabs) - var(--term) - var(--status));padding:clamp(28px,5vh,56px) var(--gut) clamp(64px,10vh,110px);border-bottom:1px solid var(--line2);scroll-margin-top:var(--chrome-top)}
.fhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(18px,3vh,30px);font:500 .78rem var(--mono);color:var(--muted)}
.fhead .path b{color:var(--ink);font-weight:500}
.fhead .lang{padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
.fhead .state{margin-left:auto;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.file.live .fhead .state{border-color:var(--teal);color:var(--teal)}
.seg{display:none;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font:500 .72rem var(--mono);color:var(--muted);cursor:pointer;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.pane{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:clamp(18px,3vw,40px);align-items:start}
@media (max-width:900px){ .pane{grid-template-columns:1fr} .seg{display:flex} .file .src,.file .view{display:none} .file[data-show="src"] .src,.file[data-show="view"] .view{display:block} }

/* source panel */
.src{position:sticky;top:calc(var(--chrome-top) + 20px);background:var(--bg2);border:1px solid var(--line2);border-radius:16px;overflow:hidden;transition:opacity .5s}
.file.live .src{opacity:.62}
.file.live .src:hover{opacity:1}
@media (max-width:900px){ .src{position:relative;top:0} .file.live .src{opacity:1} }
.src .bar{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line2);font:500 .72rem var(--mono);color:var(--faint)}
.code{margin:0;padding:14px 0;overflow-x:auto;font:500 clamp(.74rem,.7rem + .15vw,.84rem)/1.75 var(--mono);color:#D5D2C8;counter-reset:ln;tab-size:2}
.code .l{display:block;padding:0 16px 0 0;white-space:pre;min-height:1.75em}
.code .l::before{counter-increment:ln;content:counter(ln);display:inline-block;width:40px;padding-right:14px;text-align:right;color:#4A5248}
.code .l.hide{visibility:hidden}
.tk-c{color:#6F7A6C;font-style:italic} .tk-s{color:#B7D98B} .tk-k{color:#B39DFF} .tk-n{color:#F2A93B} .tk-f{color:#7FB8FF} .tk-p{color:#4CC3AE} .tk-h{color:#F2A93B;font-weight:600}
.cursorc{display:inline-block;width:.55em;height:1.1em;vertical-align:-.18em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* preview panel + hot reload flash */
.view{position:relative;min-height:40vh}
.view::before{content:"";position:absolute;inset:-8px;border-radius:18px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(242,169,59,.22),transparent);transform:translateX(-110%);opacity:0}
.file.flash .view::before{animation:sweep .7s cubic-bezier(.16,1,.3,1)}
@keyframes sweep{0%{transform:translateX(-110%);opacity:1}100%{transform:translateX(110%);opacity:0}}
.bolt{position:absolute;right:0;top:-6px;font:600 .72rem var(--mono);color:var(--on-accent);background:var(--accent);padding:4px 9px;border-radius:999px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:2}
.file.flash .bolt{opacity:1;transform:none}
.rv{will-change:transform,opacity}

/* README */
.readme .hello{font:500 .85rem var(--mono);color:var(--teal)}
.readme h1{font:800 clamp(3.6rem,1.4rem + 8vw,10rem)/.82 var(--display);font-stretch:75%;letter-spacing:-.02em;text-transform:uppercase;margin:10px 0 18px}
.readme h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px var(--ink)}
.readme .tag{font:600 clamp(1.3rem,1rem + 1.2vw,2rem)/1.15 var(--display);font-stretch:88%;max-width:26ch}
.readme .tag b{color:var(--accent);font-weight:800}
.readme .who{color:var(--muted);max-width:56ch;margin-top:14px}
.shields{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.shield{display:inline-flex;font:600 .74rem/1 var(--mono);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.shield span{padding:6px 8px;background:var(--raised);color:var(--muted)}
.shield b{padding:6px 8px;background:var(--c,var(--teal));color:#0C0F0B}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.cta{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font:600 .9rem var(--body);border:1px solid var(--line);background:transparent;cursor:pointer;transition:border-color .2s,transform .15s}
.cta:hover{border-color:var(--muted)} .cta:active{transform:scale(.97)}
.cta.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.avail{display:inline-flex;align-items:center;gap:8px;font:500 .78rem var(--mono);color:var(--muted);margin-top:22px}
.avail i{width:8px;height:8px;border-radius:50%;background:#6BE39B;box-shadow:0 0 10px #6BE39B}

/* project files */
.proj .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font:500 .78rem var(--mono);color:var(--muted)}
.proj .badge{font:600 .72rem var(--mono);color:var(--on-accent);background:var(--accent);padding:4px 10px;border-radius:999px}
.proj h2{font:800 clamp(2.6rem,1.4rem + 5vw,6.4rem)/.86 var(--display);font-stretch:76%;letter-spacing:-.02em;text-transform:uppercase;margin:14px 0 16px}
.proj .sum{color:#CFCCC2;font-size:clamp(1.02rem,.98rem + .3vw,1.2rem);max-width:54ch}
.proj .metric{display:grid;gap:4px;margin-top:26px;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:var(--panel);max-width:520px}
.proj .metric b{font:800 clamp(2.4rem,1.4rem + 3.4vw,4.4rem)/.9 var(--display);font-stretch:78%;font-variant-numeric:tabular-nums;color:var(--ink)}
.proj .metric span{color:var(--muted);font-size:.9rem}
.proj.feat .metric{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.chip{font:500 .74rem/1 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
.points{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:8px;max-width:58ch}
.points li{display:flex;gap:10px;color:var(--muted)}
.points li::before{content:"→";color:var(--teal);font-family:var(--mono)}

/* experience.log */
.log{position:relative;display:grid}
.log::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--line)}
.entry{position:relative;padding:0 0 clamp(26px,4vh,40px) 34px}
.entry::before{content:"";position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--faint)}
.entry.head::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px rgba(242,169,59,.18)}
.entry.fl::before{border-color:var(--teal)}
.entry .ref{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 .76rem var(--mono);color:var(--muted)}
.entry .br{font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.entry.head .br{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.entry.fl .br{border-color:var(--teal);color:var(--teal)}
.entry h3{font:800 clamp(1.7rem,1.2rem + 1.6vw,2.6rem)/.92 var(--display);font-stretch:80%;text-transform:uppercase;margin-top:10px}
.entry .role{font:500 .85rem var(--mono);color:var(--accent);margin-top:6px}
.entry p{color:var(--muted);margin-top:8px;max-width:60ch}
.entry .ship{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.entry .ship span{font:500 .78rem var(--mono);padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.entry .ship b{color:var(--ink);font-weight:600}

/* stack.json */
.groups{display:grid;gap:22px}
.group h3{font:600 .75rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.tool{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 16px}
.tool .lg{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:700 .85rem var(--mono)}
.tool b{font:600 .98rem var(--body)}
.tool small{display:block;font:400 .75rem var(--body);color:var(--muted)}

/* ship.yml */
.run{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
.run .rhd{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font:500 .8rem var(--mono);color:var(--muted)}
.run .rhd b{color:var(--ink);font-weight:500}
.run .rhd .res{color:var(--teal)}
.jobs{display:grid}
.job{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line2)}
.job:last-child{border-bottom:0}
.job .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;font:700 .7rem var(--mono);color:var(--on-accent);transition:background .3s,border-color .3s}
.job.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.job.ok .dot{background:var(--teal);border-color:var(--teal)}
@keyframes spin{to{transform:rotate(360deg)}}
.job h3{font:800 1.45rem/1 var(--display);font-stretch:80%;text-transform:uppercase}
.job p{color:var(--muted);font-size:.9rem;margin-top:2px}
.job .t{font:500 .75rem var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.job.ok .t{color:var(--teal)}

/* contact.sh */
.contact h2{font:800 clamp(2.6rem,1.4rem + 5vw,6rem)/.86 var(--display);font-stretch:76%;text-transform:uppercase;margin-bottom:14px}
.contact h2 em{font-style:normal;color:var(--accent)}
.contact .lead{color:var(--muted);max-width:50ch;margin-bottom:22px}
form.brief{display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2.4vw,28px);max-width:640px}
.brief .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){ .brief .row{grid-template-columns:1fr} }
.brief label{display:grid;gap:6px;font:500 .75rem var(--mono);color:var(--muted)}
.brief input,.brief textarea{font:500 1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;width:100%}
.brief textarea{min-height:110px;resize:vertical}
.brief input:focus,.brief textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(242,169,59,.14)}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:inline-flex;cursor:pointer;position:relative}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{font:500 .85rem var(--body);color:#CFCCC2;border:1px solid var(--line);padding:9px 13px;border-radius:99px}
.radios input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.radios input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.eof{font:500 .75rem var(--mono);color:var(--faint);margin-top:40px}

/* palette */
.palette{position:fixed;inset:0;z-index:150;display:grid;place-items:start center;padding:12vh 16px 16px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .2s}
.palette.open{opacity:1;pointer-events:auto}
.pal{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transform:translateY(-8px) scale(.98);transition:transform .3s cubic-bezier(.16,1,.3,1);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.palette.open .pal{transform:none}
.pal .box{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.pal .box span{font:500 .8rem var(--mono);color:var(--accent)}
#q{flex:1;min-width:0;height:54px;background:none;border:0;outline:0;color:var(--ink);font:500 1rem var(--mono)}
#q::placeholder{color:var(--muted)}
#results{list-style:none;margin:0;padding:6px;max-height:56vh;overflow:auto}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}
.opt[aria-selected="true"]{background:var(--raised)}
.opt .nm{font:500 .88rem var(--mono);color:var(--ink)}
.opt .nm mark{background:none;color:var(--accent)}
.opt .ds{grid-column:2;font-size:.8rem;color:var(--muted)}
.opt .dir{grid-row:1 / 3;grid-column:3;font:500 .72rem var(--mono);color:var(--faint)}
.pal .foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font:500 .7rem var(--mono);color:var(--muted)}
.pal kbd{font:inherit;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink)}

@media (prefers-reduced-motion: reduce){ .cursorc,.job.run .dot{animation:none} .file.flash .view::before{animation:none} }
</style>

<header class="titlebar">
  <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="crumb" id="crumb"><b>abishek</b> / README.md</span>
  <button class="goto" id="openPal" type="button" aria-label="Go to file">Go to file <kbd>⌘K</kbd></button>
</header>

<aside class="explorer" aria-label="Files">
  <div class="hd">Explorer · abishek</div>
  <ul class="tree" id="tree"></ul>
  <div class="foot">⎇ main · 1,557 commits<br><b>● open to work</b><br>Tiruchirappalli · IST</div>
</aside>

<nav class="tabs" id="tabs" aria-label="Open files"></nav>

/* ================= syntax highlighter (tiny, per language) ================= */
const KW = {
  dart:'final|var|const|await|async|return|if|else|new|void|class',
  js:'const|let|await|async|return|if|else|new|import|export|from|function',
  jsx:'const|let|await|async|return|if|else|new|import|export|from|function|lazy',
  sh:'node|docker|compose|up|sh|curl|export',
  json:'', yml:'name|on|jobs|needs|run', md:'', log:''
};
function hlLine(line, ext){
  let h = esc(line);
  if (ext === 'md'){
    if (/^#/.test(line)) return '<span class="tk-h">'+h+'</span>';
    if (/^&gt;/.test(h)) return '<span class="tk-c">'+h+'</span>';
    return h.replace(/\*\*(.+?)\*\*/g,'<span class="tk-n">**$1**</span>').replace(/!\[(.+?)\]\((.+?)\)/g,'<span class="tk-p">![$1]</span><span class="tk-s">($2)</span>').replace(/^- /,'<span class="tk-k">- </span>');
  }
  if (ext === 'log') return h.replace(/\((.+?)\)/,'<span class="tk-n">($1)</span>').replace(/^([*|])/,'<span class="tk-p">$1</span>');
  const cm = (ext === 'sh' || ext === 'yml') ? /(#.*)$/ : /(\/\/.*)$/;
  let comment = '';
  const m = h.match(cm);
  if (m && !(ext === 'sh' && /^#!/.test(line))){ comment = '<span class="tk-c">'+m[1]+'</span>'; h = h.slice(0, m.index); }
  if (ext === 'sh' && /^#!/.test(line)) return '<span class="tk-c">'+h+'</span>';
  h = h.replace(/(&quot;.*?&quot;|'[^']*'|`[^`]*`)/g,'\u0000$1\u0001');
  const parts = h.split(/(\u0000.*?\u0001)/);
  h = parts.map(p => {
    if (p.startsWith('\u0000')) return '<span class="tk-s">'+p.slice(1,-1)+'</span>';
    let q = p.replace(/\b(\d[\d,.]*)\b/g,'<span class="tk-n">$1</span>');
    if (KW[ext]) q = q.replace(new RegExp('\\b('+KW[ext]+')\\b','g'),'<span class="tk-k">$1</span>');
    q = q.replace(/\b([a-zA-Z_]\w*)(?=\()/g,'<span class="tk-f">$1</span>');
    q = q.replace(/(\$\w+)/g,'<span class="tk-p">$1</span>');
    return q;
  }).join('');
  return h + comment;
}

/* ================= terminal + status ================= */
const term = $('#term'), crumb = $('#crumb'), sLang = $('#sLang'), sLn = $('#sLn'), sReload = $('#sReload');
let reloads = 0;
function termPush(html){ term.insertAdjacentHTML('beforeend', '<div class="ln">'+html+'</div>'); while (term.children.length > 6) term.firstChild.remove(); }
function termCmd(cmd, done){
  const el = document.createElement('div'); el.className = 'ln'; term.appendChild(el); while (term.children.length > 6) term.firstChild.remove();
  if (!motion){ el.innerHTML = '<span class="p">$</span> <span class="c">'+esc(cmd)+'</span>'; done && done(); return; }
  let i = 0; const t = setInterval(() => { i += 2; el.innerHTML = '<span class="p">$</span> <span class="c">'+esc(cmd.slice(0,i))+'</span>'; if (i >= cmd.length){ clearInterval(t); done && done(); } }, 16);
}
termPush('<span class="ok">abishek</span> · 12 files · ⎇ main · type <span class="c">⌘K</span> to jump to a file');
function status(){ sLn.textContent = 'Ln ' + (Math.floor(scrollY/24)+1).toLocaleString('en-IN') + ', Col 1'; }
addEventListener('scroll', status, {passive:true}); status();

/* ================= tabs + explorer follow the file you're in ================= */
const tabsEl = $('#tabs'), opened = [];
function openTab(id){
  const f = byId[id];
  if (!opened.includes(id)){ opened.push(id); tabsEl.insertAdjacentHTML('beforeend', '<button type="button" class="tab new" data-go="'+id+'"><span class="ic '+f.ext+'">'+f.ext.slice(0,2).toUpperCase()+'</span>'+esc(f.path.split('/').pop())+'</button>'); }
  $$('.tab', tabsEl).forEach(t => t.classList.toggle('on', t.dataset.go === id));
  const on = $('.tab.on', tabsEl); on && on.scrollIntoView({inline:'nearest', block:'nearest'});
  $$('a', tree).forEach(a => a.classList.toggle('on', a.dataset.go === id));
  crumb.innerHTML = '<b>abishek</b> / ' + esc(f.path).replace(/\//g,' / ');
  sLang.textContent = LANG[f.ext];
}
let currentId = null;
const followIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && e.target.dataset.id !== currentId){ currentId = e.target.dataset.id; openTab(currentId); } }), {rootMargin:'-40% 0px -55% 0px'});
fileEls.forEach(el => followIO.observe(el));

/* ================= hot reload: type the source, flash, build the preview ================= */
function setShow(el, v){ el.dataset.show = v; $$('.seg button', el).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
$$('.seg').forEach(seg => seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setShow(seg.closest('.file'), b.dataset.v); }));
function reload(el){
  if (el.dataset.done) return; el.dataset.done = '1';
  const f = byId[el.dataset.id], lines = $$('.code .l', el), rv = $$('.rv', el.querySelector('.view')), t0 = performance.now();
  const finish = () => {
    el.classList.add('live', 'flash'); setShow(el, 'view'); $('.state', el).textContent = '⚡ live';
    if (motion) gsap.fromTo(rv, {y:34, opacity:0}, {y:0, opacity:1, duration:.9, ease:'expo.out', stagger:.06});
    setTimeout(() => el.classList.remove('flash'), 900);
    const ms = Math.round(performance.now() - t0);
    reloads++; sReload.textContent = '⚡ ' + reloads + ' reload' + (reloads > 1 ? 's' : '');
    termPush('<span class="ok">✓</span> hot reload · '+ms+' ms · '+esc(f.path));
    const a = $('a[data-go="'+f.id+'"]', tree); a && a.classList.add('done');
    if (f.id === 'ship') runPipeline();
  };
  termCmd(f.cmd, () => {
    if (!motion){ finish(); return; }
    lines.forEach(l => l.classList.add('hide'));
    let i = 0; const step = () => { if (i < lines.length){ lines[i++].classList.remove('hide'); setTimeout(step, 38); } else setTimeout(finish, 140); };
    step();
  });
}
if (motion){
  fileEls.forEach(el => { if (el.dataset.id !== 'readme') gsap.set($$('.rv', el), {opacity:0}); });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); reload(e.target); } }), {threshold:.22});
  fileEls.forEach(el => io.observe(el));
} else fileEls.forEach(reload);

/* ship.yml runs like a CI job */
function runPipeline(){
  const jobs = $$('#f-ship .job'), res = $('#runRes'), durs = [2.1, 4.8, 3.2, 1.9, 0.6];
  res.textContent = 'in progress';
  const go = i => {
    if (i >= jobs.length){ res.textContent = '✓ success'; termPush('<span class="ok">✓</span> how-i-ship · 5 jobs passed'); return; }
    const j = jobs[i]; j.classList.add('run');
    setTimeout(() => { j.classList.remove('run'); j.classList.add('ok'); $('.dot', j).textContent = '✓'; $('.t', j).textContent = durs[i].toFixed(1)+'s'; go(i+1); }, motion ? 520 : 0);
  };
  go(0);
}

/* ================= navigation: tabs, tree, buttons ================= */
let lenis = null;
function goTo(id){
  const el = document.getElementById('f-'+id); if (!el) return;
  const top = el.getBoundingClientRect().top + scrollY - parseFloat(getComputedStyle(el).scrollMarginTop || 0);
  if (lenis) lenis.scrollTo(top, {duration:1.4}); else scrollTo({top, behavior: reduce ? 'auto' : 'smooth'});
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); goTo(g.dataset.go); return; }
  if (e.target.closest('[data-pal]')) openPal();
});

/* ================= go to file (⌘K) ================= */
const pal = $('#palette'), qEl = $('#q'), resEl = $('#results'); let cur = [], act = 0, lastFocus = null;
function score(f, q){
  const t = q.toLowerCase().trim(); if (!t) return 1;
  let s = 0; const name = f.path.toLowerCase();
  if (name.includes(t)) s += 10;
  t.split(/\s+/).forEach(w => { if (!w) return; if (name.includes(w)) s += 4; f.tags.forEach(tag => { if (tag === w) s += 6; else if (tag.startsWith(w)) s += 3; }); if (f.ds.toLowerCase().includes(w)) s += 2; });
  let fi = 0; for (const ch of t.replace(/\s/g,'')) { fi = name.indexOf(ch, fi); if (fi < 0){ fi = -1; break; } fi++; } if (fi > 0) s += 1;
  return s;
}
function mark(path, q){ const t = q.toLowerCase().trim(); if (!t) return esc(path); const i = path.toLowerCase().indexOf(t); return i < 0 ? esc(path) : esc(path.slice(0,i)) + '<mark>' + esc(path.slice(i, i+t.length)) + '</mark>' + esc(path.slice(i+t.length)); }
function renderPal(){
  const q = qEl.value; cur = FILES.map(f => ({f, s:score(f,q)})).filter(x => x.s > 0).sort((a,b) => b.s - a.s); act = 0;
  resEl.innerHTML = cur.length ? cur.map((x,i) => '<li class="opt" role="option" id="o-'+x.f.id+'" data-id="'+x.f.id+'" aria-selected="'+(i===0)+'"><span class="ic '+x.f.ext+'">'+x.f.ext.slice(0,2).toUpperCase()+'</span><span class="nm">'+mark(x.f.path.split('/').pop(), q)+'</span><span class="dir">'+esc(x.f.dir || '/')+'</span><span class="ds">'+esc(x.f.ds)+'</span></li>').join('') : '<li class="opt" aria-disabled="true"><span></span><span class="ds">No file matches “'+esc(q)+'”. Try flutter, infra or contact.</span></li>';
  qEl.setAttribute('aria-activedescendant', cur[0] ? 'o-'+cur[0].f.id : '');
}
function setAct(i){ const o = $$('.opt[data-id]', resEl); if (!o.length) return; act = (i+o.length)%o.length; o.forEach((x,j) => x.setAttribute('aria-selected', String(j===act))); o[act].scrollIntoView({block:'nearest'}); qEl.setAttribute('aria-activedescendant', o[act].id); }
function openPal(){ lastFocus = document.activeElement; pal.classList.add('open'); qEl.value = ''; renderPal(); setTimeout(() => qEl.focus(), 30); lenis && lenis.stop(); }
function closePal(){ pal.classList.remove('open'); lenis && lenis.start(); lastFocus && lastFocus.focus && lastFocus.focus(); }
function pick(id){ closePal(); goTo(id); }
qEl.addEventListener('input', renderPal);
qEl.addEventListener('keydown', e => { if (e.key==='ArrowDown'){ e.preventDefault(); setAct(act+1); } else if (e.key==='ArrowUp'){ e.preventDefault(); setAct(act-1); } else if (e.key==='Enter' && cur[act]){ e.preventDefault(); pick(cur[act].f.id); } });
resEl.addEventListener('click', e => { const o = e.target.closest('.opt[data-id]'); if (o) pick(o.dataset.id); });
pal.addEventListener('click', e => { if (e.target === pal) closePal(); });
$('#openPal').addEventListener('click', openPal);
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.key.toLowerCase() === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)){ e.preventDefault(); pal.classList.contains('open') ? closePal() : openPal(); }
  else if (e.key === 'Escape' && pal.classList.contains('open')) closePal();
});

/* ================= contact.sh ================= */
document.addEventListener('submit', e => {
  if (e.target.id !== 'brief') return; e.preventDefault();
  const form = e.target, f = new FormData(form), name = String(f.get('name')).trim(), who = String(f.get('contact')).trim();
  if (!name || !who){ termPush('<span style="color:var(--red)">✗</span> contact.sh: --name and --reply-to are required'); (name ? form.contact : form.name).focus(); return; }
  const body = 'Hi Abishek,\n\nName: '+name+'\nReply to: '+who+'\nProject: '+f.get('type')+'\n\n'+(f.get('msg')||'');
  location.href = 'mailto:abishek.mk.01@gmail.com?subject=' + encodeURIComponent('Project: ' + f.get('type')) + '&body=' + encodeURIComponent(body);
  termPush('<span class="ok">✓</span> brief ready · your mail app opened · exit 0');
});

/* ================= smooth scroll + scroll depth ================= */
if (motion){
  gsap.registerPlugin(ScrollTrigger);
  if (window.Lenis){ lenis = new Lenis({lerp:.1, smoothWheel:true}); lenis.on('scroll', ScrollTrigger.update); lenis.on('scroll', status); gsap.ticker.add(t => lenis.raf(t*1000)); gsap.ticker.lagSmoothing(0); }
  // the source panel drifts a little slower than the preview: depth without decoration
  fileEls.forEach(el => gsap.fromTo($('.src', el), {y:30}, {y:-30, ease:'none', scrollTrigger:{trigger:el, start:'top bottom', end:'bottom top', scrub:true}}));
  // big headings lean in as they arrive
  $$('.proj h2, .readme h1, .contact h2').forEach(h => gsap.fromTo(h, {letterSpacing:'.02em'}, {letterSpacing:'-.02em', ease:'none', scrollTrigger:{trigger:h, start:'top 95%', end:'top 45%', scrub:true}}));
}
})();
</script>
